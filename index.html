<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advisory Board Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:      #0D1B40;
    --navy-mid:  #1a2d5a;
    --red:       #CC0000;
    --red-dark:  #991B1B;
    --gray-text: #444444;
    --gray-light:#EEEEEE;
    --gray-muted:#999999;
    --white:     #FFFFFF;
    --font:      'DM Sans', sans-serif;
  }

  body {
    font-family: var(--font);
    background: #F4F5F7;
    min-height: 100vh;
    padding: 16px;
  }

  /* ── HEADER ── */
  .page-header {
    background: var(--navy);
    color: var(--white);
    padding: 12px 20px;
    margin-bottom: 14px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .page-header h1 { font-size: 12px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; }
  .page-header .sub { font-size: 11px; color: rgba(255,255,255,0.45); }

  /* ── MAIN GRID ── */
  .grid {
    display: grid;
    grid-template-columns: 290px 1fr 280px;
    gap: 10px;
    align-items: start;
  }

  .col { background: var(--white); border-radius: 4px; overflow: hidden; }

  .col-header {
    background: var(--navy);
    padding: 9px 13px;
  }
  .col-header h2 {
    color: var(--white);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  /* ── COLUMN 1: EVIDENZE ── */
  .evidence-card {
    padding: 13px 13px 11px;
    border-bottom: 1px solid var(--gray-light);
    border-left: 4px solid var(--navy);
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 0 9px;
  }
  .evidence-card:last-child { border-bottom: none; }
  .ev-badge {
    width: 26px; height: 26px;
    background: var(--navy);
    color: var(--white);
    font-size: 12px; font-weight: 600;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .ev-title { font-size: 12px; font-weight: 600; color: var(--navy); line-height: 1.3; margin-bottom: 3px; }
  .ev-desc  { font-size: 11px; color: var(--gray-text); line-height: 1.4; margin-bottom: 5px; }
  .ev-fonte { font-size: 10px; color: var(--gray-muted); font-style: italic; }

  /* ── COLUMN 2: INSIGHT ── */
  .col2-body { padding: 13px; }
  .section-label {
    font-size: 10px; font-weight: 600;
    letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--red); margin-bottom: 10px;
  }
  .section-label.dark { color: #333; }

  .theme-row {
    display: grid;
    grid-template-columns: 1fr 26px;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }
  .theme-name { font-size: 11px; color: #333; margin-bottom: 3px; line-height: 1.2; }
  .bar-track {
    height: 7px; background: var(--gray-light);
    border-radius: 4px; overflow: hidden;
  }
  .bar-fill {
    height: 100%; background: var(--red);
    border-radius: 4px;
  }
  .bar-fill.navy { background: var(--navy); }
  .theme-val { font-size: 11px; font-weight: 600; color: var(--red); text-align: right; }
  .theme-val.navy { color: var(--navy); }

  .divider { height: 1px; background: var(--gray-light); margin: 12px 0; }

  .sub-label {
    font-size: 10px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .sub-label.red { color: var(--red); }
  .sub-label.dark { color: #333; }

  .driver-row {
    display: grid;
    grid-template-columns: 10px 1fr 34px;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }
  .driver-dot {
    width: 8px; height: 8px;
    border-radius: 50%; background: var(--red); flex-shrink: 0;
  }
  .driver-dot.navy { background: var(--navy); }
  .driver-name { font-size: 11px; color: #333; line-height: 1.2; margin-bottom: 3px; }
  .driver-pct { font-size: 11px; font-weight: 600; color: var(--red); text-align: right; }
  .driver-pct.navy { color: var(--navy); }

  /* ── COLUMN 3: TAKEAWAY ── */
  .takeaway-card {
    padding: 11px 13px;
    border-bottom: 1px solid var(--gray-light);
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 0 9px;
  }
  .takeaway-card:last-child { border-bottom: none; }
  .tw-badge {
    width: 22px; height: 22px;
    background: var(--red); color: var(--white);
    font-size: 11px; font-weight: 600;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .tw-title { font-size: 12px; font-weight: 600; color: var(--navy); line-height: 1.3; margin-bottom: 3px; }
  .tw-desc  { font-size: 11px; color: #555; line-height: 1.4; }

  .dist-header {
    padding: 9px 13px 7px;
    font-size: 10px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase;
    color: #333;
    border-top: 1px solid var(--gray-light);
  }
  .dist-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
    padding: 0 9px 9px;
  }
  .dist-cell {
    border-radius: 4px; padding: 9px 7px;
    display: flex; flex-direction: column;
    justify-content: space-between; min-height: 66px;
  }
  .dist-topic { font-size: 9px; color: rgba(255,255,255,0.82); line-height: 1.3; }
  .dist-pct   { font-size: 20px; font-weight: 600; color: var(--white); margin-top: 4px; }

  /* ── QUOTES ROW ── */
  .quotes-section {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 2px;
  }
  .quote-card {
    background: var(--white);
    border-radius: 4px;
    padding: 13px 15px;
    border-left: 3px solid var(--red);
  }
  .quote-text   { font-size: 11px; color: #333; line-height: 1.55; font-style: italic; margin-bottom: 8px; }
  .quote-author { font-size: 10px; color: var(--gray-muted); font-weight: 500; }
  .quote-author span { color: var(--red); }

  /* ── LOADING STATE ── */
  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 200px; color: var(--gray-muted); font-size: 13px;
  }
</style>
</head>
<body>

<div id="app">
  <div class="loading">Caricamento dashboard...</div>
</div>

<script>
// ── FETCH DATA AND RENDER ────────────────────────────────────────────────────
async function loadDashboard() {
  try {
    const res  = await fetch('./data.json');
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('app').innerHTML =
      '<div class="loading">Errore nel caricamento di data.json — assicurati di aprire la pagina tramite un server locale o GitHub Pages.</div>';
  }
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render(d) {
  const app = document.getElementById('app');
  app.innerHTML = `
    ${header(d.meta)}
    <div class="grid">
      ${col1(d.evidenze)}
      ${col2(d.temi, d.drivers, d.barriere)}
      ${col3(d.takeaway, d.distribuzione)}
      ${quotes(d.quote)}
    </div>
  `;
}

function header(m) {
  return `
    <div class="page-header">
      <h1>${m.title} — ${m.subtitle}</h1>
      <span class="sub">${m.topic} · ${m.date}</span>
    </div>`;
}

function col1(evidenze) {
  const cards = evidenze.map((e, i) => `
    <div class="evidence-card">
      <div class="ev-badge">${i + 1}</div>
      <div>
        <div class="ev-title">${e.titolo}</div>
        <div class="ev-desc">${e.descrizione}</div>
        <div class="ev-fonte">Fonte: ${e.fonte}</div>
      </div>
    </div>`).join('');

  return `
    <div class="col">
      <div class="col-header"><h2>Evidenze in discussione</h2></div>
      ${cards}
    </div>`;
}

function col2(temi, drivers, barriere) {
  const maxVal = Math.max(...temi.map(t => t.valore));

  const temiHtml = temi.map(t => `
    <div class="theme-row">
      <div>
        <div class="theme-name">${t.nome}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${Math.round((t.valore / maxVal) * 100)}%"></div>
        </div>
      </div>
      <div class="theme-val">${t.valore}</div>
    </div>`).join('');

  const driversHtml = drivers.map(d => `
    <div class="driver-row">
      <div class="driver-dot"></div>
      <div>
        <div class="driver-name">${d.nome}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${d.pct}%"></div>
        </div>
      </div>
      <div class="driver-pct">${d.pct}%</div>
    </div>`).join('');

  const barriereHtml = barriere.map(b => `
    <div class="driver-row">
      <div class="driver-dot navy"></div>
      <div>
        <div class="driver-name">${b.nome}</div>
        <div class="bar-track">
          <div class="bar-fill navy" style="width:${b.pct}%"></div>
        </div>
      </div>
      <div class="driver-pct navy">${b.pct}%</div>
    </div>`).join('');

  return `
    <div class="col">
      <div class="col-header"><h2>Insight emersi in tempo reale</h2></div>
      <div class="col2-body">
        <div class="section-label">Temi chiave emersi</div>
        ${temiHtml}
        <div class="divider"></div>
        <div class="sub-label dark">Drivers e barriere (votazione live)</div>
        <div class="sub-label red" style="margin-top:8px">Drivers principali</div>
        ${driversHtml}
        <div class="sub-label red" style="margin-top:10px">Barriere principali</div>
        ${barriereHtml}
      </div>
    </div>`;
}

function col3(takeaway, distribuzione) {
  const twHtml = takeaway.map((t, i) => `
    <div class="takeaway-card">
      <div class="tw-badge">${i + 1}</div>
      <div>
        <div class="tw-title">${t.titolo}</div>
        <div class="tw-desc">${t.descrizione}</div>
      </div>
    </div>`).join('');

  const distHtml = distribuzione.map(d => `
    <div class="dist-cell" style="background:${d.colore}">
      <div class="dist-topic">${d.tema}</div>
      <div class="dist-pct">${d.pct !== null ? d.pct + '%' : '—'}</div>
    </div>`).join('');

  return `
    <div class="col">
      <div class="col-header"><h2>Top takeaway emersi</h2></div>
      ${twHtml}
      <div class="dist-header">Distribuzione interventi per tema</div>
      <div class="dist-grid">${distHtml}</div>
    </div>`;
}

function quotes(quoteList) {
  const html = quoteList.map(q => `
    <div class="quote-card">
      <div class="quote-text">"${q.testo}"</div>
      <div class="quote-author"><span>${q.speaker}</span> · ${q.timestamp}</div>
    </div>`).join('');

  return `<div class="quotes-section">${html}</div>`;
}

// ── START ────────────────────────────────────────────────────────────────────
loadDashboard();
</script>
</body>
</html>
